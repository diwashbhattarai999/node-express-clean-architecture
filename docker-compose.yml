services:
  postgres:
    image: postgres:18-alpine
    container_name: node-express-clean-architecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: node_express_clean_architecture
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node_express_clean_architecture"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
